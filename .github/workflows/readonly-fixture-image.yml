name: Publish read-only synthetic fixture diagnostic
on:
  push:
    branches: [fix/readonly-fixture-probe-20261104]
permissions:
  contents: read
concurrency:
  group: readonly-fixture-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'purplemediagib/airank.me' && github.ref == 'refs/heads/fix/readonly-fixture-probe-20261104'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node --test diagnostics/read-only-fixture-20261104/*.test.mjs
  publish:
    needs: test
    if: github.repository == 'purplemediagib/airank.me' && github.ref == 'refs/heads/fix/readonly-fixture-probe-20261104'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build isolated immutable diagnostic, without deploying
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          image="ghcr.io/purplemediagib/airank.me/analytics:readonly-probe-sha-$REVISION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          if docker manifest inspect "$image" > manifest.json 2> manifest-error.txt; then
            printf 'Reusing immutable diagnostic: %s\n' "$image"
          elif grep -Eqi 'manifest unknown|no such manifest|not found' manifest-error.txt; then
            docker build --platform linux/amd64 --build-arg "BUILD_REVISION=$REVISION" --label "org.opencontainers.image.revision=$REVISION" --tag "$image" diagnostics/read-only-fixture-20261104
            docker push "$image"
          else
            cat manifest-error.txt >&2
            exit 1
          fi
          docker pull "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          case "$digest" in ghcr.io/purplemediagib/airank.me/analytics@sha256:*) ;; *) exit 1 ;; esac
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker image inspect "$digest" --format '{{.Config.User}}')" = node
          test "$(docker image inspect "$digest" --format '{{json .Config.Cmd}}')" = '["node","hold.mjs"]'
          probe_hash=$(sha256sum diagnostics/read-only-fixture-20261104/probe.mjs | cut -d' ' -f1)
          hold_hash=$(sha256sum diagnostics/read-only-fixture-20261104/hold.mjs | cut -d' ' -f1)
          docker run --rm --network none --env "EXPECTED_PROBE_HASH=$probe_hash" --env "EXPECTED_HOLD_HASH=$hold_hash" --env "EXPECTED_BUILD_REVISION=$REVISION" --entrypoint node "$digest" --input-type=module -e "const fs=await import('node:fs');const crypto=await import('node:crypto');for(const [file,expected] of [['probe.mjs',process.env.EXPECTED_PROBE_HASH],['hold.mjs',process.env.EXPECTED_HOLD_HASH]])if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==expected)throw Error('image source mismatch');if(process.env.AIRANK_BUILD_REVISION!==process.env.EXPECTED_BUILD_REVISION)throw Error('revision mismatch');if(JSON.stringify(fs.readdirSync('/diagnostic').sort())!==JSON.stringify(['hold.mjs','probe.mjs']))throw Error('unexpected runtime files');globalThis.fetch=()=>{throw Error('network forbidden')};const m=await import('./hold.mjs');const env=new Proxy({},{get(){throw Error('credentials must remain unread')}});if((await m.runConfiguredProbe({env})).status!=='not_run')throw Error('not inert');console.log('READ_ONLY_PROBE_OFFLINE_VERIFIED');"
          printf 'READ_ONLY_FIXTURE_CANDIDATE revision=%s image=%s digest=%s\n' "$REVISION" "$image" "$digest"
          printf '### Read-only fixture diagnostic\n\nRevision: `%s`\n\nImage: `%s`\n\nDigest: `%s`\n\nNo deployment, provider requests, database requests, or credential changes performed.\n' "$REVISION" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
