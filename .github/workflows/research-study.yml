name: Private reviewed job
run-name: Private reviewed job
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit one-time operation
        required: true
        type: choice
        options: [private-job]
      expires_at_utc:
        description: Exact UTC expiry from reviewed private policy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: research-model-agreement-v01
  cancel-in-progress: false
jobs:
  private-job:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'private-job' && github.actor == 'purplemediagib' && github.ref == 'refs/heads/research/model-agreement-v01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: airank-research-model-agreement-v01
    env:
      REVIEWED_REPOSITORY: purplemediagib/airank.me
      REVIEWED_BRANCH: research/model-agreement-v01
      REVIEWED_ACTOR: purplemediagib
      REVIEWED_ENVIRONMENT: airank-research-model-agreement-v01
      REVIEWED_CONCURRENCY_GROUP: research-model-agreement-v01
      REVIEWED_BOOTSTRAP_SHA: ${{ vars.RESEARCH_APPROVED_COMMIT_SHA }}
      REVIEWED_PRIVATE_POLICY_SHA256: ${{ secrets.REVIEWED_PRIVATE_POLICY_SHA256 }}
      REVIEWED_PRIVATE_BUNDLE_SHA256: ${{ secrets.REVIEWED_PRIVATE_BUNDLE_SHA256 }}
      REVIEWED_PRIVATE_CONTRACT_SHA256: ${{ secrets.REVIEWED_PRIVATE_CONTRACT_SHA256 }}
      REQUESTED_EXPIRY: ${{ inputs.expires_at_utc }}
    steps:
      - name: Check exact reviewed revision before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_BOOTSTRAP_SHA"
      - name: Checkout only generic bootstrap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/private_job/bootstrap.py
            /tools/private_job/verify_inputs.py
      - name: Authenticate private inputs and verify without provider keys
        shell: bash
        env:
          PRIVATE_POLICY_URL: ${{ secrets.PRIVATE_POLICY_URL }}
          PRIVATE_BUNDLE_URL: ${{ secrets.PRIVATE_BUNDLE_URL }}
          PRIVATE_STORAGE_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          python tools/private_job/bootstrap.py verify --root "$RUNNER_TEMP/private_job" --observed-revision "$REVISION"
      - name: Apply reviewed nonpaid private amendment
        shell: bash
        env:
          PRIVATE_STORAGE_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          python tools/private_job/bootstrap.py prepare --root "$RUNNER_TEMP/private_job" --observed-revision "$REVISION"
      - name: Execute approved finite private operation
        shell: bash
        env:
          PRIVATE_STORAGE_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          python tools/private_job/bootstrap.py execute --root "$RUNNER_TEMP/private_job" --observed-revision "$REVISION"
