name: Publish gemini-location-kimi-timeout worker candidate
on:
  push:
    branches: [fix/gemini-location-kimi-timeout-20261111]
permissions:
  contents: read
concurrency:
  group: gemini-location-kimi-timeout-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'purplemediagib/airank.me' && github.ref == 'refs/heads/fix/gemini-location-kimi-timeout-20261111'
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.repository == 'purplemediagib/airank.me' && github.ref == 'refs/heads/fix/gemini-location-kimi-timeout-20261111'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish and verify immutable candidate without deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SERVICE: worker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          image="ghcr.io/${REPOSITORY,,}/$SERVICE:candidate-sha-$REVISION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          if docker manifest inspect "$image" > manifest.json 2> manifest-error.txt; then
            echo 'Existing commit tag will be verified, never overwritten.'
          elif grep -Eqi 'manifest unknown|no such manifest' manifest-error.txt; then
            docker build --platform linux/amd64 --target "$SERVICE" --build-arg "BUILD_REVISION=$REVISION" --label "org.opencontainers.image.revision=$REVISION" --tag "$image" .
            docker push "$image"
          else
            echo 'Registry lookup inconclusive; refusing publication.' >&2
            exit 1
          fi
          docker pull "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          case "$digest" in "ghcr.io/${REPOSITORY,,}/$SERVICE@sha256:"*) ;; *) exit 1 ;; esac
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$digest" --format '{{.Config.User}}')" = node
          test "$(docker image inspect "$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          docker run --rm --network none --entrypoint npm "$digest" ls --omit=dev
          docker run --rm --network none --env "EXPECTED_BUILD_REVISION=$REVISION" --entrypoint node "$digest" -e "if(process.env.NODE_ENV!=='production'||process.env.AIRANK_BUILD_REVISION!==process.env.EXPECTED_BUILD_REVISION)throw Error('runtime revision/environment mismatch');Promise.all([import('@libsql/client/web'),import('./src/app/service.mjs'),import('./src/content/engine.mjs'),import('./src/providers/answer-policy.mjs')])"
          container=$(docker create "$digest")
          mkdir -p pulled-source
          docker cp "$container:/app/src/." pulled-source/
          docker cp "$container:/app/package-lock.json" pulled-source-package-lock.json
          docker rm "$container"
          diff -r app/src pulled-source
          cmp app/package-lock.json pulled-source-package-lock.json
          printf '### %s candidate\n\nRevision: `%s`\n\nTag: `%s`\n\nImmutable digest: `%s`\n\nNo deployment, migration or provider call was run.\n' "$SERVICE" "$REVISION" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'GEMINI_KIMI_CANDIDATE service=%s revision=%s image=%s digest=%s\n' "$SERVICE" "$REVISION" "$image" "$digest"
