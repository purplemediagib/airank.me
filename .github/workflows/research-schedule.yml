name: Finite research cloud scheduler
on:
  schedule:
    - cron: '45 12 12 11 *'
    - cron: '45 8 14,18 11 *'
  issues:
    types: [opened]
permissions:
  contents: read
  actions: write
concurrency:
  group: research-model-agreement-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'schedule' || (github.event_name == 'issues' && github.actor == 'purplemediagib' && github.event.issue.user.login == 'purplemediagib')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only the reviewed finite study
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Finite scheduler plus owner-only issue fallback; no provider calls or retry."""
          import datetime,json,os,sys
          from urllib.request import Request,urlopen
          REPOSITORY='purplemediagib/airank.me'
          OWNER='purplemediagib'
          BRANCH='research/model-agreement-v01'
          APPROVED_SHA='93ddd341fdaf93bc66ad37025af8b9210189eea8'
          SLOTS={'1':'2026-11-12T13:00:00Z','2':'2026-11-14T09:00:00Z','3':'2026-11-18T09:00:00Z'}
          def eligible(now):
              for number,stamp in SLOTS.items():
                  start=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
                  if start-datetime.timedelta(minutes=30)<=now<=start+datetime.timedelta(minutes=10):
                      return number
              return None
          def marker(number):
              return ('Research round '+number, 'Scheduled UTC: '+SLOTS[number])
          def validate_event(event_name,actor,event,number):
              if event_name=='schedule':
                  return
              if event_name!='issues' or event.get('action')!='opened' or actor!=OWNER:
                  raise RuntimeError('Unexpected trigger or actor')
              issue=event.get('issue',{})
              if issue.get('user',{}).get('login')!=OWNER or 'pull_request' in issue:
                  raise RuntimeError('Unexpected issue author')
              title,body=marker(number)
              if issue.get('title')!=title or issue.get('body')!=body:
                  raise RuntimeError('Issue does not exactly match the approved round/time marker')
          def main():
              now=datetime.datetime.now(datetime.timezone.utc)
              round_number=eligible(now)
              if not round_number:
                  print('Outside the three approved dates/start windows; no dispatch.');return
              if os.environ.get('GITHUB_REPOSITORY')!=REPOSITORY:
                  raise RuntimeError('Unexpected repository')
              with open(os.environ['GITHUB_EVENT_PATH']) as source:
                  event=json.load(source)
              validate_event(os.environ.get('GITHUB_EVENT_NAME'),os.environ.get('GITHUB_ACTOR'),event,round_number)
              token=os.environ['GH_TOKEN']
              def api(path,data=None):
                  request=Request('https://api.github.com/repos/'+REPOSITORY+path,
                      None if data is None else json.dumps(data).encode(),
                      {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
                      method='GET' if data is None else 'POST')
                  with urlopen(request,timeout=30) as response:
                      raw=response.read();return json.loads(raw) if raw else None
              if api('/git/ref/heads/'+BRANCH)['object']['sha']!=APPROVED_SHA:
                  raise RuntimeError('Research branch no longer matches reviewed code; no dispatch')
              # Paginate instead of silently ignoring older attempts beyond the first 100.
              runs=[]
              for page in range(1,11):
                  batch=api('/actions/workflows/research-study.yml/runs?branch=research%2Fmodel-agreement-v01&per_page=100&page='+str(page))['workflow_runs']
                  runs.extend(batch)
                  if len(batch)<100:break
              else:
                  raise RuntimeError('History exceeds inspection limit; no dispatch')
              label='research cloud-round round '+round_number
              if any(r.get('display_title')==label for r in runs):
                  print('Round already has a workflow attempt; no retry or duplicate.');return
              if any(r['status']!='completed' for r in runs):
                  raise RuntimeError('Another research job is pending or active; no dispatch')
              api('/actions/workflows/research-study.yml/dispatches',{'ref':BRANCH,'inputs':{'operation':'cloud-round','round_number':round_number,'diagnostic_id':''}})
              print('Accepted one dispatch for research round '+round_number+'. Completion must be verified in research workflow/private ledger.')
          if __name__=='__main__':
              try:main()
              except Exception:
                  print('Scheduler blocked or dispatch outcome uncertain. Inspect Actions before any retry.');sys.exit(2)
          PYTHON
